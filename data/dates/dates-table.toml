# Dates-and-duties table: the dates from which AI Act duties apply, per label.
#
# The model never learns dates; this table does. Every date was read from the
# Official Journal text of Regulation (EU) 2024/1689 (Article 113) and of
# Regulation (EU) 2026/1744 (which replaced Article 113, points (a) and (c), and
# added Article 111(4)). Duties are article references with the Act's own short
# titles, not obligation text. The lookup (`python -m lab.dates lookup`) refuses
# to serve the table until the owner has approved it.
#
# Learning project, not legal advice.

