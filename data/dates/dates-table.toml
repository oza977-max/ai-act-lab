verified = true
plan_value = "2026-12-02"
discrepancy_note = ""
note = "Article 50 applies from the general date (Article 113). Which paragraph applies depends on the system: 50(1) and 50(2) bind providers, 50(3) and 50(4) bind deployers. Generative systems placed on the market before 2 August 2026 have until 2 December 2026 for 50(2) (Article 111(4), added by Regulation (EU) 2026/1744, https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng)."

