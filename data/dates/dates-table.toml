# Dates-and-duties table: the dates from which AI Act duties apply, per label.
#
# The model never learns dates; this table does. Every date was read from the
# Official Journal text of Regulation (EU) 2024/1689 (Article 113) and of
# Regulation (EU) 2026/1744 (which replaced Article 113, points (a) and (c), and
# added Article 111(4)). Duties are article references with the Act's own short
# titles, not obligation text; titles of single points such as Art. 5(1)(ba) are
# this table's short descriptions, because the Act titles whole articles only.
# AI literacy (Art. 4, as replaced by Regulation (EU) 2026/1744: "Providers and
# deployers of AI systems shall take measures to support the development of AI
# literacy of their staff") is listed once per answer, for the tiers under which
# a system may be on the market: high-risk, transparency-only and minimal. The lookup (`python -m lab.dates lookup`) refuses
# to serve the table until the owner has approved it.
#
# Learning project, not legal advice.

version = "v1"
approved_by = ""
approved_on = ""

[[changes]]
version = "v1"
date = 2026-10-27
change = "First version: nine entries; every plan date checked against the Official Journal, no discrepancy found."
reason = "Build chunk P2-C03"

