# Practice run 001 settings, chosen by the owner on 2026-10-27 (LG-3).
# Batch 4 ran out of GPU memory on the 8 GB M2; batch 1 with gradient checkpointing
# and 8 layers peaked at 6.4 GB in a 10-step test (owner chose 8 layers over 16).
# Model: Qwen3.5-0.8B 4-bit, pinned revision da28692b (see data/models.toml).
train: true
data: "data/practice/mlx"
adapter_path: "adapters/practice-001"
fine_tune_type: lora
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
num_layers: 8
learning_rate: 1.0e-4
iters: 300
batch_size: 1
grad_checkpoint: true
mask_prompt: true
steps_per_report: 10
steps_per_eval: 25
val_batches: -1
save_every: 25
max_seq_length: 1024
seed: 20261027
